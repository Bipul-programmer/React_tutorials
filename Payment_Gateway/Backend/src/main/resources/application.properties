# Server Port Configuration
server.port=8080

# Application Name
spring.application.name=payment-api

# H2 Database Configuration (Default in-memory database for immediate execution)
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uncomment below lines if using PostgreSQL database:
# spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Razorpay API Credentials Configuration (Replace with actual keys for production)
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_key_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# Logging Settings
logging.level.org.springframework.web=INFO
logging.level.com.example.payment=DEBUG
