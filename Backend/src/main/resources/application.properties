# =====================================================
# DevHub - Spring Boot Application Configuration
# =====================================================

# Server
server.port=8080
spring.application.name=devhub-backend

# =====================================================
# PostgreSQL Database Configuration
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/devhub_db
spring.datasource.username=bipulkumar
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=DevHubPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# JPA / Hibernate Configuration
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =====================================================
# Flyway Database Migration
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =====================================================
# Logging
# =====================================================
logging.level.org.springframework.web=INFO
logging.level.com.devhub=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# =====================================================
# JWT Configuration
# =====================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 Hours in milliseconds (86400000)
app.jwt.expiration=86400000

